<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="100%" stop-color="#12151F" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181C28" />
      <stop offset="100%" stop-color="#10131B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#F3C368" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景底板 -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGrad)" stroke="#222736" stroke-width="1.5" />
  
  <!-- 标题与标头 -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#E5A93C" letter-spacing="1.5">PRISM PLAY CORE</text>
    <text x="210" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#A4ADC0">｜ 流媒体解析协同与跨端播放架构拓扑</text>
  </g>

  <!-- 1. 云端解析协同层 (Cloud Resolution Layer) -->
  <g transform="translate(40, 80)">
    <rect width="920" height="95" rx="12" fill="url(#cardGrad)" stroke="#2A3042" stroke-width="1.5" />
    <rect x="0" y="0" width="6" height="95" rx="3" fill="#E5A93C" />
    <text x="24" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#E5A93C">01 / 云端解析与元数据协同层 (Cloud Resolution &amp; Manifest Ingest)</text>
    
    <!-- 子模块 -->
    <g transform="translate(24, 42)">
      <!-- 块 1 -->
      <rect width="270" height="38" rx="6" fill="#1B202E" stroke="#31394D" />
      <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#F4F6FB">动态流解析 (URL Parser / HLS Probe)</text>
      <!-- 块 2 -->
      <rect x="295" width="285" height="38" rx="6" fill="#1B202E" stroke="#31394D" />
      <text x="310" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#F4F6FB">剧目/分集清单下发 (Season &amp; Episode)</text>
      <!-- 块 3 -->
      <rect x="605" width="265" height="38" rx="6" fill="#1B202E" stroke="#31394D" />
      <text x="620" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#F4F6FB">线路故障退避与重试 (Line Failover)</text>
    </g>
  </g>

  <!-- 连接箭头 1 -> 2 -->
  <g stroke="#E5A93C" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 500 175 L 500 205" />
    <polygon points="500,210 496,202 504,202" fill="#E5A93C" />
  </g>

  <!-- 2. 端侧播放控制中枢 (Core Playback Engine) -->
  <g transform="translate(40, 215)">
    <rect width="920" height="150" rx="12" fill="url(#cardGrad)" stroke="#2A3042" stroke-width="1.5" />
    <rect x="0" y="0" width="6" height="150" rx="3" fill="#E5A93C" />
    <text x="24" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#E5A93C">02 / 统一播放门面与状态机调度 (Unified Playback Facade &amp; Seam)</text>

    <!-- 调度中枢网格 -->
    <g transform="translate(24, 42)">
      <!-- 核心门面 -->
      <rect width="415" height="88" rx="8" fill="#1B202E" stroke="#3B455C" stroke-dasharray="4,2" />
      <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F4F6FB">PrismPlayer 门面控制器</text>
      <text x="16" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#A4ADC0">• 统一生命周期管理 (Play / Pause / Seek / Destroy)</text>
      <text x="16" y="70" font-family="-apple-system, sans-serif" font-size="11" fill="#A4ADC0">• 防假死状态机：加载超时、重连退避、缓冲监听</text>

      <!-- 双轨驱动路由 -->
      <g transform="translate(440, 0)">
        <rect width="430" height="40" rx="6" fill="#1B202E" stroke="#31394D" />
        <text x="16" y="25" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#F4F6FB">Web 引擎：ArtPlayer 5.4 + Hls.js (自适应码率切片)</text>

        <rect y="48" width="430" height="40" rx="6" fill="#1B202E" stroke="#31394D" />
        <text x="16" y="73" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#F4F6FB">原生内核：Android ExoPlayer / Media3 (TextureView 穿透)</text>
      </g>
    </g>
  </g>

  <!-- 连接箭头 2 -> 3 -->
  <g stroke="#E5A93C" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 500 365 L 500 395" />
    <polygon points="500,400 496,392 504,392" fill="#E5A93C" />
  </g>

  <!-- 3. 交互系统与展示层 (Presentation & Gesture Layer) -->
  <g transform="translate(40, 405)">
    <rect width="920" height="95" rx="12" fill="url(#cardGrad)" stroke="#2A3042" stroke-width="1.5" />
    <rect x="0" y="0" width="6" height="95" rx="3" fill="#E5A93C" />
    <text x="24" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#E5A93C">03 / 移动端触控交互与设计系统 (Gestures HUD &amp; Design Tokens)</text>

    <g transform="translate(24, 42)">
      <rect width="270" height="38" rx="6" fill="#1B202E" stroke="#31394D" />
      <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#F4F6FB">全手势 HUD (左滑亮/右滑音/双击进退)</text>

      <rect x="295" width="285" height="38" rx="6" fill="#1B202E" stroke="#31394D" />
      <text x="310" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#F4F6FB">常驻选集横滑轨 &amp; 音频波形指示动效</text>

      <rect x="605" width="265" height="38" rx="6" fill="#1B202E" stroke="#31394D" />
      <text x="620" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#F4F6FB">琥珀金/黑曜石夜空 日夜双模 Tokens</text>
    </g>
  </g>

  <!-- 4. 底层跨端宿主适配 (Host Runtime) -->
  <g transform="translate(40, 520)">
    <rect width="920" height="70" rx="10" fill="#141722" stroke="#252A3A" />
    <text x="24" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#A4ADC0">04 / 跨端物理宿主 (Capacitor 7 Edge-to-Edge Runtime)</text>
    <text x="24" y="48" font-family="-apple-system, sans-serif" font-size="12" fill="#717A8C">Android 沉浸式透明状态栏 ｜ 屏幕方向与物理横竖屏锁定 ｜ 系统音频焦点劫持与来电自暂挂</text>
  </g>
</svg>
